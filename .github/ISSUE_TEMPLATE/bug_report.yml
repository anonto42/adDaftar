name: 🐛 Bug Report
description: Report a bug or issue with adDaftar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: e.g., 1.0.3
      placeholder: "1.0.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device Model (Optional)
      description: e.g., Samsung Galaxy S24, iPhone 15 Pro, etc.
      placeholder: "Samsung Galaxy S24"
  - type: input
    id: os-version
    attributes:
      label: OS Version (Optional)
      description: e.g., Android 15, iOS 18.1, etc.
      placeholder: "Android 15"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video (Optional)
      description: If applicable, add screenshots or a video to help explain your problem.
  - type: textarea
    id: logs
    attributes:
      label: Error Logs (Optional)
      description: If available, include relevant error logs or console output.
      render: "console"
  - type: checkboxes
    id: additional
    attributes:
      label: Additional Context
      options:
        - label: I have tested this on the latest version of adDaftar
        - label: I have searched the existing issues to avoid duplicates
