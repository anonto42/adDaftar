name: Build & Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish APK to a GitHub Release (uses version from package.json)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java (JDK 17 for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Prebuild Android native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build Standalone Release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Prepare APK file
        id: find-apk
        run: |
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::No APK file found after Gradle build"
            exit 1
          fi
          APK_NAME="ad-daftar-v${{ steps.version.outputs.version }}.apk"
          cp "$APK_SOURCE" "./$APK_NAME"
          ls -lh "./$APK_NAME"
          echo "apk-path=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-apk.outputs.apk-path }}
          path: ${{ steps.find-apk.outputs.apk-path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.find-apk.outputs.apk-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
