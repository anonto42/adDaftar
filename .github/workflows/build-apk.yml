name: Build & Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build APK (EAS Build + Wait)
        id: build
        run: |
          URL=$(eas build --platform android --profile preview --non-interactive --wait 2>&1 | grep -oP 'https://expo\.\S+\.apk')
          if [ -z "$URL" ]; then
            # Fallback: try to extract from build artifacts line
            URL=$(eas build --platform android --profile preview --non-interactive --wait 2>&1 | grep -oP 'Build artifacts: \Khttps://\S+')
          fi
          echo "Download URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        id: download
        run: |
          URL="${{ steps.build.outputs.url }}"
          echo "Downloading from: $URL"
          curl -L "$URL" -o app.apk
          ls -la app.apk

      - name: Find APK file
        id: find-apk
        run: |
          APK_FILE=$(find . -maxdepth 1 -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found after download"
            exit 1
          fi
          echo "apk-path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK_FILE"

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-apk.outputs.apk-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
